<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Turblend</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a0810">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..600&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Space+Mono:wght@400;700&display=swap">
  <!-- Styles are inline because GitHub Pages serves this page at any missing URL,
       where relative links to css/ would break. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #1a0508; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      font: 400 1.0625rem/1.65 "DM Sans", system-ui, sans-serif;
      color: #f7ecdb;
      background-color: #2a0810;
      background-image:
        radial-gradient(70% 65% at 75% 20%, rgba(178, 42, 65, 0.55), transparent 70%),
        linear-gradient(180deg, #3e0c18, #1a0508);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin: 0;
      font: 400 0.75rem/1.5 "Space Mono", ui-monospace, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #e4bb76;
    }
    .eyebrow::before { content: ""; width: 2.25rem; height: 1px; background: currentColor; }
    h1 {
      margin: 24px 0 0;
      font: 380 clamp(2.6rem, 1.6rem + 5vw, 4.5rem)/1.02 "Fraunces", Georgia, serif;
      letter-spacing: -0.02em;
    }
    h1 em { font-weight: 350; color: #e4bb76; }
    p.body { margin: 24px 0 0; color: #dcc6af; }
    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      margin-top: 32px;
      padding: 0.9rem 1.5rem;
      border-radius: 2px;
      background: #e4bb76;
      color: #1a0508;
      font: 700 0.78rem/1.2 "Space Mono", ui-monospace, monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
    }
    a.btn:hover { background: #ecd29e; }
    a:focus-visible { outline: 2px solid #ecd29e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · Page not found</p>
    <h1>This cup came up <em>empty.</em></h1>
    <p class="body">The page you’re looking for isn’t here. The coffee, the pop-up dates, and the list are all on the home page.</p>
    <a class="btn" href="/">Back to Turblend</a>
  </main>
</body>
</html>
