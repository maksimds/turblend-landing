<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Turblend</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Yeseva+One&display=swap">
  <!-- Styles are inline because GitHub Pages serves this page at any missing URL,
       where relative links to css/ would break. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: #f7f2ea;
      color: #2e0c14;
      font: 400 1.0625rem/1.6 "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 40rem;
      padding: clamp(28px, 6vw, 56px);
      border-radius: clamp(24px, 4vw, 48px);
      background: #651d2b;
      color: #f7f2ea;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.65em;
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e2d3cd;
    }
    .eyebrow::before { content: ""; width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; }
    h1 {
      margin: 20px 0 0;
      font: 400 clamp(2.4rem, 1.4rem + 4.5vw, 4rem)/1.04 "Yeseva One", Georgia, serif;
      letter-spacing: -0.012em;
    }
    h1 em { font-family: "Josefin Sans", sans-serif; font-weight: 300; letter-spacing: -0.02em; color: #f0e2df; }
    p.body { margin: 20px 0 0; color: #e2d3cd; max-width: 34ch; }
    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 28px;
      padding: 0.95em 1.6em 0.85em;
      border-radius: 999px;
      background: #f7f2ea;
      color: #651d2b;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.18s, color 0.18s;
    }
    a.btn:hover { background: #2e0c14; color: #f7f2ea; }
    a:focus-visible { outline: 2px solid #f7f2ea; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · Page not found</p>
    <h1>This cup came up <em>empty.</em></h1>
    <p class="body">The page you’re looking for isn’t here. The coffee, the pop-up dates, and the list are all on the home page.</p>
    <a class="btn" href="/">Back to Turblend</a>
  </main>
</body>
</html>
