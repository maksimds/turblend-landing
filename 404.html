<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages serves this page at any missing URL, so every relative path and
       # link on it is anchored here. If the site moves, change this address and the
       "Back to Turblend" link below. -->
  <base href="https://maksimds.github.io/turblend-landing/">
  <title>Page not found · Turblend</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <!-- The navbar and type come from css/styles.css. This is only what this page adds. -->
  <style>
    body {
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 70px clamp(18px, 4vw, 40px);
      text-align: center;
    }
    .label { color: #725a5d; }
    h1 {
      max-width: 16ch;
      margin: 18px auto 0;
      font-size: clamp(2.125rem, 1.75rem + 1.2vw, 2.8125rem);
      font-weight: 400;
      line-height: 1.2;
    }
    p.body { max-width: 34ch; margin: 18px auto 0; font-size: 1.25rem; }
    main .cta { margin-top: 30px; font-size: 1.5rem; }
  </style>
  <script src="js/events.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- The same bar and mobile menu as index.html: keep the two in step. The # links
       lead to the home page, through the <base> address above. -->
  <header class="site-header">
    <div class="nav-slot">
      <div class="nav-shell" data-nav>
        <div class="container">
          <div class="header-bar">
            <div class="header-start">
              <button class="menu-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu-drawer" data-menu-open>
                <span class="sr-only">Open menu</span>
                <span class="menu-lines" aria-hidden="true"></span>
              </button>
              <a class="header-logo" href="./" aria-label="Turblend home page"><img src="images/turblend-bean-mark.svg" alt="" width="33" height="33"></a>
            </div>

            <a class="header-brand" href="./" aria-label="Turblend home page"><img src="images/turblend-coffee.png" alt="" width="1000" height="324"></a>

            <nav class="primary-nav" aria-label="Primary">
              <ul role="list">
                <li><a class="nav-link mini" href="#origin">Story</a></li>
                <li><a class="nav-link mini" href="#popups">Roadmap</a></li>
                <li><a class="nav-link mini" href="{BLOG URL}">Blog</a></li>
              </ul>
            </nav>

            <!-- The date and venue fill in automatically from js/events.js -->
            <a class="header-next mini" href="#popups">
              <span class="dot pulse" aria-hidden="true"></span>
              <span>Next pop-up · <strong data-next-popup data-fallback="Dates soon">Dates soon</strong></span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile menu -->
  <dialog id="menu-drawer" class="drawer" aria-label="Menu" data-drawer>
    <div class="drawer-inner">
      <div class="drawer-top">
        <div class="header-start">
          <button class="menu-btn is-close" type="button" data-menu-close>
            <span class="sr-only">Close menu</span>
            <span class="menu-lines" aria-hidden="true"></span>
          </button>
          <span class="header-logo" aria-hidden="true"><img src="images/turblend-bean-mark.svg" alt="" width="33" height="33"></span>
        </div>
        <p class="drawer-brand" aria-hidden="true"><img src="images/turblend-coffee.png" alt="" width="1000" height="324"></p>
      </div>
      <nav class="drawer-nav">
        <ul role="list">
          <li><a href="#origin"><span class="drawer-num mini" aria-hidden="true">01</span><span>Story</span></a></li>
          <li><a href="#popups"><span class="drawer-num mini" aria-hidden="true">02</span><span>Roadmap</span></a></li>
          <li><a href="{BLOG URL}"><span class="drawer-num mini" aria-hidden="true">03</span><span>Blog</span></a></li>
        </ul>
      </nav>
      <div class="drawer-actions">
        <a class="cta" href="#signup"><span>Get on the list</span><svg class="ar" viewBox="0 0 24 10" aria-hidden="true"><path d="M.5 5h22.5M18.5 1 23 5l-4.5 4"/></svg></a>
        <a class="cta" href="#popups"><span>Find a pop-up</span><svg class="ar" viewBox="0 0 24 10" aria-hidden="true"><path d="M.5 5h22.5M18.5 1 23 5l-4.5 4"/></svg></a>
      </div>
    </div>
  </dialog>

  <main>
    <p class="mini label">404 · Page not found</p>
    <h1>This cup came up <em>empty.</em></h1>
    <p class="body">The page you’re looking for isn’t here. The coffee, the pop-up dates, and the list are all on the home page.</p>
    <a class="cta" href="https://maksimds.github.io/turblend-landing/"><span>Back to Turblend</span><svg class="ar" viewBox="0 0 24 10" aria-hidden="true"><path d="M.5 5h22.5M18.5 1 23 5l-4.5 4"/></svg></a>
  </main>
</body>
</html>
